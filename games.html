<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Games - GameDev Hub</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            🎮 GameDev Hub
        </div>

        <nav>

            <a href="user.html">
                Dashboard
            </a>

            <a href="games.html">
                Games
            </a>

            <a href="#" onclick="logout()">
                Logout
            </a>

        </nav>

    </header>


    <!-- GAMES -->

    <main class="games-container">

        <div class="page-title">

            <h1>🎮 Available Games</h1>

            <p>
                Explore games available on GameDev Hub.
            </p>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search games..."
                onkeyup="searchGames()"
            >

        </div>


        <!-- GAME GRID -->

        <section
            class="games-grid"
            id="gamesGrid"
        >

        </section>

    </main>


    <script>


        /*
            CHECK USER LOGIN
        */

        if (
            localStorage.getItem("loggedIn") !== "true" ||
            localStorage.getItem("role") !== "user"
        ) {

            window.location.href =
                "login.html";

        }


        /*
            DISPLAY GAMES
        */

        function displayGames(gameData) {

            let gamesGrid =
                document.getElementById("gamesGrid");


            gamesGrid.innerHTML = "";


            if (gameData.length === 0) {

                gamesGrid.innerHTML = `

                    <div class="no-games">

                        <h2>No Games Found 🎮</h2>

                        <p>
                            Ask the admin to add some games.
                        </p>

                    </div>

                `;

                return;

            }


            gameData.forEach(function(game) {

                gamesGrid.innerHTML += `

                    <div class="game-card">

                        <div class="game-image">
                            🎮
                        </div>

                        <div class="game-content">

                            <h2>
                                ${game.name}
                            </h2>

                            <p>
                                <strong>Developer:</strong>
                                ${game.developer}
                            </p>

                            <p>
                                <strong>Genre:</strong>
                                ${game.genre}
                            </p>

                            <button
                                onclick="playGame('${game.name}')">
                                View Game
                            </button>

                        </div>

                    </div>

                `;

            });

        }


        /*
            GET GAMES FROM LOCAL STORAGE
        */

        let games =
            JSON.parse(
                localStorage.getItem("games")
            ) || [];


        displayGames(games);


        /*
            SEARCH GAMES
        */

        function searchGames() {

            let search =
                document.getElementById("search")
                .value
                .toLowerCase();


            let filteredGames =
                games.filter(function(game) {

                    return (
                        game.name
                            .toLowerCase()
                            .includes(search) ||

                        game.genre
                            .toLowerCase()
                            .includes(search) ||

                        game.developer
                            .toLowerCase()
                            .includes(search)
                    );

                });


            displayGames(filteredGames);

        }


        /*
            VIEW GAME
        */

        function playGame(gameName) {

            alert(
                "You selected: " + gameName
            );

        }


        /*
            LOGOUT
        */

        function logout() {

            localStorage.removeItem("loggedIn");

            localStorage.removeItem("role");

            localStorage.removeItem("userEmail");

            window.location.href =
                "index.html";

        }

    </script>


</body>

</html>
